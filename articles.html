	<script>

		// Load footer.html into the placeholder
		fetch('components/footer.html')
			.then(response => response.text())
			.then(data => {
				document.getElementById('footer-placeholder').innerHTML = data;
			});
	</script>

	<script>
		fetch('../data/articles.json')
			.then(response => response.json())
			.then(data => {
				console.log('Articles data loaded:', data);
				const articlesSection = document.querySelector('.article-section');
				data.forEach(article => {
					const articleDiv = document.createElement('div');
					articleDiv.className = 'article-block';
					articleDiv.innerHTML = `					
						<img src="/${article.image}" alt="Article 01 Image" />
						<div class="article-content">
							<h4>${article.title}</h4>
							<p>${article.description}</p>
							<a href="/articles/${article.link}" class="button cta">Learn More</a>
						</div>
					`;
					articlesSection.appendChild(articleDiv);
				});
			})
			.catch(error => console.error('Error loading articles:', error));
	</script>

	<script>
		$(document).ready(function () {
			// Hide all items initially
			$('.custom-layout').hide();

			// Show only present by default
			$('.custom-layout.present').show();

			// Filter click behavior
			$('[data-filter]').click(function (e) {
				e.preventDefault();
				var filter = $(this).data('filter');

				// Hide all
				$('.custom-layout').hide();

				// Show matched
				if (filter === '*') {
					$('.custom-layout').show();
				} else {
					$(filter).show();
				}
			});
		});
	</script>

	<script>
		$(document).ready(function () {
			// Hide all initially
			$('.custom-layout').hide();
			$('.custom-layout.present').show();

			function showFilter(filterClass) {
				// Show/hide content
				$('.custom-layout').hide();
				$(filterClass).show();

				// Update active class on filter menu
				$('[data-filter]').removeClass('active');
				$(`[data-filter="${filterClass}"]`).addClass('active');
			}

			// Filter menu click
			$('[data-filter]').click(function (e) {
				e.preventDefault();
				const filter = $(this).data('filter');
				showFilter(filter);
			});

			// Arrow click toggles between views
			$('.arrow').click(function () {
				const nextFilter = $('.custom-layout.present').is(':visible') ? '.past' : '.present';
				showFilter(nextFilter);
			});
		});
	</script>

	<script>
		async function loadHeaderAndInitTimber() {
			const res = await fetch("components/header.html");
			const html = await res.text();
			document.getElementById("header-placeholder").innerHTML = html;

			// Get the current file name from the URL
			const currentPath = window.location.pathname.split('/').pop() || 'index.html';

			// Find all nav links in the header
			const navLinks = document.querySelectorAll('#header-placeholder nav a');

			navLinks.forEach(link => {
				const linkPath = link.getAttribute('href');

				// Match current page and add class to parent <li>
				if (linkPath === currentPath) {
					const li = link.closest('li');
					if (li) {
						li.classList.add('current');
					}
				}
			});

			// Timber must be loaded AFTER header is injected
			const script = document.createElement("script");
			script.src = "js/timber.master.min.js";
			document.body.appendChild(script);
		}

		loadHeaderAndInitTimber();
	</script>
